<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HKTDC Social Sharing Pop-up Demo</title>

  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="HKTDC Event - Share & Invite" />
  <meta property="og:description" content="Share your registration and invite industry peers to join." />
  <meta property="og:image" content="./img/event-photo.jpg" />
  <meta property="og:type" content="website" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Demo Controls (for testing different options & languages) -->
  <div class="switcher-container">
    <select id="optionSelect" onchange="updatePopup()">
      <option value="1">Option 1 - Share Your Attendance</option>
      <option value="2">Option 2 - Let Your Peers Know</option>
      <option value="3">Option 3 - You're Attending</option>
    </select>

    <select id="languageSelect" onchange="updatePopup()">
      <option value="en">English</option>
      <option value="tc">繁體中文</option>
      <option value="sc">简体中文</option>
    </select>
  </div>

  <!-- Pop-up Overlay -->
  <div id="overlay" class="overlay">
    <div class="popup">
      <span class="close" onclick="closePopup()">×</span>

      <!-- Title & Subtitle -->
      <div class="title-section">
        <h2 id="popupTitle">Bring your network along</h2>
        <p class="subtitle" id="popupSubtitle">share your referral link today.</p>
      </div>

      <!-- Event Photo Area (1:1, top-aligned) -->
      <div class="event-photo-area">
        <img id="eventPhoto" src="./img/event-photo.svg" alt="Event Photo" class="event-photo">
      </div>

      <!-- Action Buttons -->
      <div class="action-buttons">
        <button class="btn primary" id="downloadBtn" onclick="downloadImage()">
          ↓ Download Image
        </button>
        <button class="btn secondary" id="copyBtn" onclick="copyShareableLink()">
          ⎘ Copy Shareable Link
        </button>
      </div>

      <!-- Social Share Section -->
      <p class="share-label" id="shareLabel">Or share directly:</p>
      
      <div class="share-icons">
        <div class="icon linkedin" onclick="shareTo('linkedin')" title="LinkedIn">
          <i class="fab fa-linkedin-in"></i>
        </div>
        <div class="icon facebook" onclick="shareTo('facebook')" title="Facebook">
          <i class="fab fa-facebook-f"></i>
        </div>
        <div class="icon x" onclick="shareTo('x')" title="X">
          <i class="fab fa-x-twitter"></i>
        </div>
        <div class="icon threads" onclick="shareTo('threads')" title="Threads">
          <i class="fab fa-threads"></i>
        </div>
        <div class="icon whatsapp" onclick="shareTo('whatsapp')" title="WhatsApp">
          <i class="fab fa-whatsapp"></i>
        </div>
        <div class="icon email" onclick="shareTo('email')" title="Email">
          <i class="fas fa-envelope"></i>
        </div>
        <div class="icon qr" onclick="generateQRCode()" title="QR Code">
          <i class="fas fa-qrcode"></i>
        </div>
      </div>
    </div>
  </div>

  <!-- QR Code Modal -->
  <div id="qrModal" class="modal">
    <div class="modal-content">
      <span class="close-modal" onclick="closeQRModal()">×</span>
      <h3>Scan to Register</h3>
      <img id="qrImage" alt="QR Code" style="width:200px; height:200px; margin:20px auto; display:block;">
      <br>
      <button onclick="downloadQRCode()" style="padding:10px 16px; background:#FF6B00; color:white; border:none; border-radius:6px; cursor:pointer;">
        Download QR Code
      </button>
    </div>
  </div>

  <script src="js/translations.js"></script>
  <script src="script.js"></script>
</body>
</html>
